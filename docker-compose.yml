services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantastiqueboy-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:../db/custom.db
      - AUTH_SECRET=${AUTH_SECRET:-change-me-to-a-random-string}
    volumes:
      - app-db:/app/db
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: fantastiqueboy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  app-db:
  caddy-data:
  caddy-config:

networks:
  web:
    driver: bridge
