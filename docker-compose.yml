version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1-icons-league
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:../db/f1icons.db
      - NODE_ENV=production
    volumes:
      - f1icons-db:/app/db
    networks:
      - f1icons-network

volumes:
  f1icons-db:
    driver: local

networks:
  f1icons-network:
    driver: bridge
